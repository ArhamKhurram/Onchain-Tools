name: CI

# Verifies every workspace lints, typechecks and builds before code can merge.
# Wire this to branch protection on `main` (and ideally `dev`) so a red run
# blocks the merge — this is the gate that stops a broken commit reaching
# Railway/Vercel.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # NOTE: this display name is what branch protection matches as a required
    # status check — renaming it silently stops the required check reporting.
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # Backend + fomo-worker depend on Playwright, whose postinstall downloads
      # Chromium. CI only needs to compile, so skip the ~150 MB download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Build the shared package first — backend/frontend resolve @oct/shared
      # from its built dist. (The root `prepare` script also builds it on
      # install; this is an explicit belt-and-suspenders step.)
      - name: Build @oct/shared
        run: npm run build -w @oct/shared

      # --- Typecheck every workspace (no emit) ---
      - name: Typecheck backend
        run: npm run typecheck -w backend
      - name: Typecheck frontend
        run: npm run typecheck -w frontend
      - name: Typecheck landing
        run: npm run typecheck -w landing
      - name: Typecheck fomo-worker
        run: npm run typecheck -w fomo-worker
      - name: Typecheck lp-automation
        run: npm run typecheck -w lp-automation

      # --- Lint (frontend only, for now) ---
      # `react-hooks/rules-of-hooks` is an error, so this step is a hard gate.
      # It exists because a hook placed after an early return typechecks and
      # builds cleanly, then blanks the page at runtime with an empty console
      # (see f382999) — tsc cannot see that class of bug, only the linter can.
      # Other workspaces have no ESLint config yet; adding them is follow-up work.
      - name: Lint frontend
        run: npm run lint -w frontend

      # --- Unit tests (pure functions: contract/keyword detection, convergence) ---
      - name: Test backend
        run: npm run test -w backend
      - name: Test frontend
        run: npm run test -w frontend
      # LP automation: policy validation, efficiency scoring, switching buffer,
      # Krystal response mappers, tick math. All pure — no chain, no network.
      - name: Test lp-automation
        run: npm run test -w lp-automation

      # --- Build the three deploy targets (backend→Railway, frontend+landing→Vercel) ---
      - name: Build backend
        run: npm run build -w backend
      - name: Build frontend
        run: npm run build -w frontend
      - name: Build landing
        run: npm run build -w landing

  # The LP automation Safe module is the on-chain trust boundary over real funds.
  # Foundry is not installed on the maintainer's machine, so THIS JOB IS THE ONLY
  # automated verification the Solidity gets — treat a red run here as blocking,
  # not advisory.
  contracts:
    name: Foundry (LP automation module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lp-automation/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # contracts/lib/ is gitignored, so forge-std is vendored here at a pinned
      # tag rather than committed as a submodule.
      - name: Vendor forge-std
        run: git clone --depth 1 --branch v1.9.6 https://github.com/foundry-rs/forge-std lib/forge-std

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv
