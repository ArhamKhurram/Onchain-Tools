name: CI

# Verifies every workspace typechecks and builds before code can merge.
# Wire this to branch protection on `main` (and ideally `dev`) so a red run
# blocks the merge — this is the gate that stops a broken commit reaching
# Railway/Vercel.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # Backend + fomo-worker depend on Playwright, whose postinstall downloads
      # Chromium. CI only needs to compile, so skip the ~150 MB download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      # Build the shared package first — backend/frontend resolve @oct/shared
      # from its built dist. (The root `prepare` script also builds it on
      # install; this is an explicit belt-and-suspenders step.)
      - name: Build @oct/shared
        run: npm run build -w @oct/shared

      # --- Typecheck every workspace (no emit) ---
      # The four typechecks are independent (each is its own tsc invocation),
      # so run them concurrently and gate on the slowest instead of the sum.
      # Logs are captured per workspace and replayed in collapsible groups so
      # a failure still reads like the old serial output.
      - name: Typecheck (all workspaces, parallel)
        run: |
          set -u
          run() { npm run typecheck -w "$1" > "/tmp/tc-$1.log" 2>&1; echo $? > "/tmp/tc-$1.code"; }
          for ws in backend frontend landing fomo-worker; do run "$ws" & done
          wait
          fail=0
          for ws in backend frontend landing fomo-worker; do
            code=$(cat "/tmp/tc-$ws.code")
            echo "::group::typecheck $ws (exit $code)"
            cat "/tmp/tc-$ws.log"
            echo "::endgroup::"
            if [ "$code" != "0" ]; then
              echo "::error::typecheck $ws failed (exit $code)"
              fail=1
            fi
          done
          exit $fail

      # --- Unit tests (pure functions: contract/keyword detection, convergence) ---
      - name: Test backend
        run: npm run test -w backend
      - name: Test frontend
        run: npm run test -w frontend
      - name: Test fomo-worker
        run: npm run test -w fomo-worker

      # --- Build the three deploy targets (backend→Railway, frontend+landing→Vercel) ---
      # Independent workspaces with separate output dirs — same parallel
      # pattern as the typecheck step above.
      - name: Build (backend, frontend, landing, parallel)
        run: |
          set -u
          run() { npm run build -w "$1" > "/tmp/build-$1.log" 2>&1; echo $? > "/tmp/build-$1.code"; }
          for ws in backend frontend landing; do run "$ws" & done
          wait
          fail=0
          for ws in backend frontend landing; do
            code=$(cat "/tmp/build-$ws.code")
            echo "::group::build $ws (exit $code)"
            cat "/tmp/build-$ws.log"
            echo "::endgroup::"
            if [ "$code" != "0" ]; then
              echo "::error::build $ws failed (exit $code)"
              fail=1
            fi
          done
          exit $fail

  # NOTE: the Foundry job that verifies the LP automation Safe module lives on
  # the `LP-Feats` and `dev` branches, where that code now sits. It is still the
  # only automated verification the Solidity gets — a red run there is blocking.
