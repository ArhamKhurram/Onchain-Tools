name: CI

# Verifies every workspace typechecks and builds before code can merge.
# Wire this to branch protection on `main` (and ideally `dev`) so a red run
# blocks the merge — this is the gate that stops a broken commit reaching
# Railway/Vercel.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    env:
      # Backend + fomo-worker depend on Playwright, whose postinstall downloads
      # Chromium. CI only needs to compile, so skip the ~150 MB download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Cache the installed node_modules trees keyed on the exact lockfile.
      # On a hit we skip `npm ci` entirely (20-40s of extract/link work) —
      # an identical lockfile produces an identical tree, so this is safe.
      # The one script `npm ci` would have run that matters (root `prepare`
      # building @oct/shared) is covered by the explicit build step below.
      - name: Restore node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
            landing/node_modules
            fomo-worker/node_modules
            docs/node_modules
            user-docs/node_modules
            packages/*/node_modules
          # NOTE: 'node20' pins the tree to the Node major above — bump it in
          # lockstep with node-version so native-module builds never go stale.
          key: nm-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install (workspaces)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Build the shared package first — backend/frontend resolve @oct/shared
      # from its built dist. (The root `prepare` script also builds it on
      # install; this is an explicit belt-and-suspenders step.)
      - name: Build @oct/shared
        run: npm run build -w @oct/shared

      # --- Typecheck every workspace (no emit) ---
      - name: Typecheck backend
        run: npm run typecheck -w backend
      - name: Typecheck frontend
        run: npm run typecheck -w frontend
      - name: Typecheck landing
        run: npm run typecheck -w landing
      - name: Typecheck fomo-worker
        run: npm run typecheck -w fomo-worker

      # --- Unit tests (pure functions: contract/keyword detection, convergence) ---
      - name: Test backend
        run: npm run test -w backend
      - name: Test frontend
        run: npm run test -w frontend
      - name: Test fomo-worker
        run: npm run test -w fomo-worker

      # --- Build the three deploy targets (backend→Railway, frontend+landing→Vercel) ---
      - name: Build backend
        run: npm run build -w backend
      - name: Build frontend
        run: npm run build -w frontend
      - name: Build landing
        run: npm run build -w landing

  # NOTE: the Foundry job that verifies the LP automation Safe module lives on
  # the `LP-Feats` and `dev` branches, where that code now sits. It is still the
  # only automated verification the Solidity gets — a red run there is blocking.
