appId: app.onchaintools.desktop
productName: OCT
copyright: Copyright © Onchain Tools

# Populates the GitHub Release body (install / macOS first-launch instructions).
releaseInfo:
  releaseNotesFile: build/release-notes.md

directories:
  output: release

# App sources that go into the asar. Backend bundle + frontend are shipped
# unpacked via extraResources below. Dev-only dependencies (electron,
# electron-builder, esbuild) are pruned automatically.
files:
  - "**/*"
  - "!dist-backend/**"
  - "!release/**"
  - "!build/**"
  - "!build-backend.mjs"
  - "!electron-builder.yml"

extraResources:
  - from: "dist-backend/index.mjs"
    to: "backend/dist/index.mjs"
  - from: "../backend/data/config.default.json"
    to: "backend/data/config.default.json"
  - from: "../frontend/dist"
    to: "frontend/dist"

# Release-upload target for `electron-builder --publish` only.
#
# This is NOT an auto-update feed any more: desktop/main.js no longer runs
# electron-updater, so nothing in a shipped build ever reads latest.yml. It used
# to, and pointing it at the wrong repository served a third party's installer to
# our users under our version string - see PR #177. Re-adding an updater means
# re-adding that failure mode, so don't, unless the desktop app is a supported
# channel again.
publish:
  provider: github
  owner: ArhamKhurram
  repo: Onchain-Tools
  # Publish a real (non-draft) release so it appears at /releases/latest. Set to
  # `draft` to review before going live.
  releaseType: release

win:
  # Stable filename so the landing page can link to
  # /releases/latest/download/OCT-Setup.exe across every release.
  artifactName: OCT-Setup.${ext}
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  category: public.app-category.finance
  # Universal build so one download runs on both Intel and Apple Silicon, and a
  # stable filename for /releases/latest/download/OCT-mac.dmg.
  artifactName: OCT-mac.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

# The app is unsigned, so ship first-launch (xattr) instructions inside the DMG
# next to the app + Applications shortcut.
dmg:
  window:
    width: 540
    height: 420
  contents:
    - x: 130
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
    - x: 270
      y: 350
      type: file
      path: build/READ ME FIRST.txt
      name: READ ME FIRST.txt
